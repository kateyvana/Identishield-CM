plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'cm.identishield'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // -web fournit Tomcat : le PDP termine TLS lui-meme (client-auth=need), sans
    // reverse-proxy (OB-5 : rejet au handshake).
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // -jdbc : ecriture de l'entree d'audit (le trigger en base assure le chainage
    // in-lock). -validation : contrat /evaluate (400 sur violation). Stack Spring.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    // ADR-040 : BouncyCastle lit l'extension d'attestation Android (KeyDescription) en DER strict,
    // a la place du lecteur DER maison. Version epinglee.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat('1.22.0')
        removeUnusedImports()
    }
}
