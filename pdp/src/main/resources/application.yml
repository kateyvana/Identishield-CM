# PDP — terminaison TLS mutuelle DIRECTE par Spring Boot (Tomcat), sans
# reverse-proxy (OB-5). Le certificat serveur et l'ancre de confiance des clients
# viennent du volume `certs` genere au demarrage (infra/ca/gen-ca.sh) ; aucun
# secret ici. Bundle PEM : Spring lit directement les .crt/.key, pas de PKCS12.
server:
  port: 8443
  ssl:
    enabled: true
    bundle: pdp
    # need : le client DOIT presenter un certificat valide signe par notre CA,
    # SINON le refus a lieu au niveau de la POIGNEE DE MAIN (OB-5) ; la requete
    # n'atteint jamais le service. (want = refus applicatif = defaut, interdit.)
    client-auth: need

spring:
  application:
    name: isc-pdp
  mvc:
    servlet:
      # Pret par construction (2026-10-25) : le DispatcherServlet s'initialise au demarrage,
      # pas a la premiere requete.
      load-on-startup: 1
  config:
    # Jeu de regles versionne (source unique des parametres nommes, EF-17/ES-15),
    # monte en lecture seule. La version est portee par chaque decision /evaluate.
    import: "file:/config/ruleset.yaml"
  datasource:
    # Le PDP ecrit l'audit comme role applicatif isc_pdp_app (SELECT+INSERT sur
    # audit_entry uniquement ; aucun acces a chain_head : le trigger chaine). Mot
    # de passe depuis l'environnement (.env), jamais versionne.
    url: jdbc:postgresql://postgres:5432/identishield
    username: isc_pdp_app
    password: ${ISC_PDP_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
  ssl:
    bundle:
      pem:
        pdp:
          keystore:
            certificate: "file:/certs/pdp.crt"
            private-key: "file:/certs/pdp.key"
          truststore:
            # Ancre de confiance pour l'authentification des clients (le coeur).
            certificate: "file:/certs/ca.crt"

# Aucun endpoint metier : /evaluate est T2-05. Le PDP n'expose qu'un point de
# sante minimal (voir HealthController).

# Horloge injectable (ADR-019, EF-18, ENF-11). system = temps reel ; virtual demarre
# une VirtualClock a virtual-start (simulation). Aucune classe ne lit l'horloge
# directement : l'evaluateur et le journal d'audit (a venir) recoivent ce Clock injecte.
isc:
  clock:
    mode: system
    # virtual-start: "2026-01-01T00:00:00Z"   # utilise seulement en mode virtual
  # Empreinte du code de recuperation (ADR-041 §5, ES-18) : PBKDF2-HMAC-SHA256, parametres NOMMES
  # ici, jamais en litteraux dans le code. Iterations fixees par un BUDGET (ADR-042) : une
  # derivation <= 50 ms en mediane sur la machine de demonstration en regime chaud. Ce qui protege
  # le code est le comptage des essais en ligne (ES-21) et le second facteur (PIN), pas ce nombre.
  recovery-code:
    pbkdf2:
      iterations: 44000
      salt-bytes: 16
      key-bits: 256
