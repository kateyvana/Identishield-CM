[project]
name = "isc-simulator"
version = "0.1.0"
description = "IdentiShield-CM isc-sim : simulateur de réseau SMS (transport et interception OTP)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
isc-simulator = "isc_simulator.network:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isc_simulator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
