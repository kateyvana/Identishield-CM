# GET /flux pour la console (EF-30), HTTP simple sur isc-net (interne). Les modes
# CLI (probe/bench/transfer/ussd) desactivent le serveur via
# -Dspring.main.web-application-type=none.
server:
  port: 8080

spring:
  application:
    name: isc-core
  datasource:
    # Comptes et transactions, role isc_core_app (SELECT/INSERT/UPDATE/DELETE sur
    # le schema core). Mot de passe depuis l'environnement (.env), jamais versionne.
    # initialization-fail-timeout: -1 => connexion PARESSEUSE : le coeur demarre meme
    # sans base joignable (modes probe/bench sur un reseau sans postgres).
    url: jdbc:postgresql://postgres:5432/identishield
    username: isc_core_app
    password: ${ISC_CORE_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  config:
    # Jeu de regles versionne (source unique des parametres nommes, ES-15), monte
    # en lecture seule dans le conteneur. Le coeur y lit CAP_FAILCLOSED (ES-11).
    import: "file:/config/ruleset.yaml"

# Horloge injectable (ADR-019, ENF-11). system = temps reel ; virtual demarre une
# VirtualClock a virtual-start (simulation, EF-18). Aucune classe ne lit l'horloge
# directement : tout recoit ce Clock injecte.
isc:
  clock:
    mode: system
    # virtual-start: "2026-01-01T00:00:00Z"   # utilise seulement en mode virtual

# Client PDP (ES-11, EI-01). CAP_FAILCLOSED est un parametre NOMME : sa valeur
# vient du jeu de regles versionne, jamais d'un litteral dans le code. Les chemins pointent
# vers le volume `certs` monte au runtime ; aucun secret ici.
core:
  pdp:
    base-url: https://pdp:8443
    health-path: /health
    timeout-ms: 800
    cert-path: /certs/core.crt
    key-path: /certs/core.key
    ca-path: /certs/ca.crt
    breaker:
      failure-threshold: 3
      cooldown-ms: 5000
  # Routes /device/* du PDP (B3a) : délai DISTINCT de celui d'/evaluate, fixé d'après la mesure
  # de la dérivation PBKDF2 du code de récupération ; le calcul est dans ADR-042.
  device:
    timeout-ms: 1000
  # PIN applicatif (B3a, décision 2 ; ADR-042) : empreinte PBKDF2-HMAC-SHA256. Le nombre
  # d'itérations est fixé par un BUDGET (une dérivation <= 50 ms en médiane sur la machine de
  # démonstration, en régime chaud), pas par la recommandation pour mots de passe. Même nombre
  # que le code de récupération du PDP.
  pin:
    pbkdf2:
      iterations: 44000
      salt-bytes: 16
      key-bits: 256
  # Surface mobile en HTTPS (L7-a ; ADR-036 amendé). UN SEUL INTERRUPTEUR pour le connecteur 8443
  # ET le refus des routes /mobile/v1/* en clair sur 8080. Éteint : rien ne change. Allumé sans
  # la feuille core-mobile lisible : le cœur ne démarre pas (cause nommée). Fichiers émis par
  # l'infrastructure (L7-b, couloir A) ; noms à confirmer avec elle.
  mobile-tls:
    enabled: false
    port: 8443
    cert-path: /certs/core-mobile.crt
    key-path: /certs/core-mobile.key
  # Comptes de test (B3a, décision 6), lus SEULEMENT sous le profil demo, depuis la source unique
  # partagée avec le faux serveur. Le montage du fichier dans le conteneur est une carte infra.
  demo:
    fixtures-path: /fixtures/fixtures.json
