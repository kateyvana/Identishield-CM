# Pile IdentiShield-CM. ISC-DEPLOY §3.2 : isc-net interne, sans acces sortant.
# T2-04 ajoute l'autorite locale (ca-init) et le PDP en mTLS direct. Les cles de
# service vivent dans le volume `certs`, generees au demarrage, jamais dans le
# depot ni dans une image.
services:
  postgres:
    image: postgres:16
    container_name: isc-postgres
    env_file: .env
    networks:
      - isc-net
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/init.sql:/opt/isc/init.sql:ro
      - ./init/01-apply.sh:/docker-entrypoint-initdb.d/01-apply.sh:ro
      # Migrations du schema (infra/init/migrations/README.md). A la creation d'une base NEUVE,
      # 01-apply.sh appelle apply-migrations.sh ; sur une base EXISTANTE, c'est le conteneur
      # isc-migrate ci-dessous qui l'appelle a chaque demarrage de la pile.
      - ./init/migrations:/opt/isc/migrations:ro
      - ./init/apply-migrations.sh:/opt/isc/apply-migrations.sh:ro
    healthcheck:
      # -h 127.0.0.1 : le controle passe par TCP, comme isc-migrate, le coeur et le PDP. Sur une
      # base NEUVE, l'entrypoint de postgres:16 lance d'abord un serveur TEMPORAIRE avec
      # listen_addresses='' (docker-entrypoint.sh, docker_temp_server_start) : il n'ecoute que la
      # socket locale. Sans -h, pg_isready la voyait et declarait la base prete pendant init.sql ;
      # isc-migrate arrivait alors en TCP et recevait « connection refused » (constat L-PG-1,
      # 2026-10-25). Avec -h, la base n'est saine qu'une fois le serveur definitif a l'ecoute.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Autorite locale : genere CA + certificats de service au premier `up`, dans le
  # volume `certs`. Idempotent (reutilise si present ; down -v regenere). FORCE=1
  # force la regeneration. Ne rejoint aucun reseau : il n'ecrit qu'un volume.
  ca-init:
    build:
      context: ./ca
      dockerfile: Dockerfile.tools
    image: isc-tools
    container_name: isc-ca-init
    # Invoque via `sh` et non en exec direct : le bit d'execution du script ne
    # survit pas fiablement a git sous Windows, et un exec direct echoue alors sur
    # Linux natif (VM/CI) avec « permission denied ». `sh` le rend portable.
    command: ["sh", "/ca/gen-ca.sh"]
    environment:
      FORCE: ${FORCE:-0}
    volumes:
      - certs:/certs
      - ./ca:/ca:ro

  # Migrations du schema sur une base EXISTANTE (infra/init/migrations/README.md). Conteneur
  # d'execution unique, image postgres:16 : la MEME image que le serveur PostgreSQL (meme psql,
  # une image de moins ; la VM ne joint pas le registre, 2026-10-24, et n'a que postgres:16),
  # qui appelle apply-migrations.sh et sort en succes. isc-core et isc-pdp en dependent en
  # service_completed_successfully : une migration qui echoue arrete le demarrage de la pile.
  # Sur une base NEUVE, 01-apply.sh applique deja les memes migrations ; ce conteneur rejoue
  # alors les migrations (toutes idempotentes, verifie par tools/verify_migrations.sh), ce qui
  # est sans effet.
  migrate:
    image: postgres:16
    container_name: isc-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./init/migrations:/opt/isc/migrations:ro
      - ./init/apply-migrations.sh:/opt/isc/apply-migrations.sh:ro
    command: ["sh", "/opt/isc/apply-migrations.sh", "/opt/isc/migrations"]
    networks:
      - isc-net
    restart: "no"

  # PDP : terminaison mTLS DIRECTE (Spring Boot Tomcat, client-auth=need), sans
  # reverse-proxy (OB-5). Demarre seulement une fois la CA generee et les migrations
  # appliquees. Certificats montes en lecture seule.
  pdp:
    build:
      context: ../pdp
      dockerfile: Dockerfile
    image: isc-pdp
    container_name: isc-pdp
    # ISC_PDP_APP_PASSWORD pour la connexion audit (role isc_pdp_app). Jamais versionne.
    env_file: .env
    depends_on:
      ca-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - ../config:/config:ro # jeu de regles versionne (EF-17), source unique
    networks:
      - isc-net
    healthcheck:
      # Port ouvert = Tomcat TLS a demarre (le handshake mTLS lui-meme est teste
      # par la porte de verification, pas ici).
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8443' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Coeur : client du PDP en mTLS (connexions persistantes). Au mois 2 il n'a pas
  # d'endpoint (USSD et flux transactionnel viennent ensuite) ; il reste en vie en
  # mode service. Les modes probe/bench sont declenches par CORE_MODE (verification).
  core:
    build:
      context: ../core
      dockerfile: Dockerfile
    image: isc-core
    container_name: isc-core
    # ISC_CORE_APP_PASSWORD pour la connexion aux comptes/transactions (isc_core_app).
    env_file: .env
    depends_on:
      ca-init:
        condition: service_completed_successfully
      pdp:
        condition: service_healthy
      sim:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CORE_MODE: ${CORE_MODE:-service}
      # L7-a/L7-b : le connecteur HTTPS 8443 de la surface mobile est opt-in dans le coeur
      # (core.mobile-tls.enabled, liaison souple Spring -> CORE_MOBILETLS_ENABLED). La pile le
      # publie (8443 sur ISC_MOBILE_BIND) donc elle l'ACTIVE : constate le 2026-10-24, port
      # publie sans ecouteur (docs/03-revues/2026-10-24-deploiement-main.md, etape 6).
      CORE_MOBILETLS_ENABLED: "true"
      # Passerelle SMS : le coeur REMET l'OTP au reseau simule (isc-sim), jamais il ne le relit.
      SIM_URL: http://sim:8080
    volumes:
      - certs:/certs:ro
      - ../config:/config:ro # jeu de regles versionne (CAP_PROB), source unique
    networks:
      - isc-net
      # L7-b (carte #67) : surface mobile du coeur sur un reseau DEDIE, bridge non interne, pour
      # pouvoir publier le 8443 ; aucun autre service n'y est attache. Le PDP, isc-sim et postgres
      # restent sur isc-net interne. Sans la regle DOCKER-USER (prerequis de la proprietaire,
      # L7-3), ce reseau donnerait au coeur une sortie Internet : la pile demarre quand meme, mais
      # l'isolement du coeur n'est acquis qu'une fois la regle en place.
      - isc-mobile
    # Port publie sur l'adresse Tailscale de la VM, variable obligatoire du .env (ISC_MOBILE_BIND).
    # Non defini -> docker compose echoue avec un message qui nomme la variable. 127.0.0.1 par
    # defaut en developpement local (gen-secrets.sh). Au mois 4, le connecteur HTTPS n'ecoute pas
    # encore sur 8443 : la publication reserve le port, le listener Spring arrive avec la carte B.
    ports:
      - "${ISC_MOBILE_BIND:?ISC_MOBILE_BIND doit etre defini dans infra/.env (adresse Tailscale de la VM, ex. 100.93.166.19 ; defaut local 127.0.0.1)}:8443:8443"

  # Console operateur : lit GET /flux du coeur (isc-net) et l'affiche en temps reel
  # (EF-30). Sur isc-web (bridge) pour etre joignable au navigateur (port publie) ;
  # le coeur et le PDP restent internes. Ne se connecte a aucune base.
  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    image: isc-console
    container_name: isc-console
    environment:
      CORE_URL: http://core:8080
      # Chronologie d'attaque (T2-17, EF-41) : la console la LIT sur isc-sim (donnee de simulation),
      # jamais sur le coeur (ADR-034). isc-sim est sur isc-net interne, joignable par la console.
      SIM_URL: http://sim:8080
    depends_on:
      - core
      - sim
    networks:
      - isc-net
      - isc-web
    # #66 (L7-1) : la console permet de desactiver la couche (POST /api/mode) et affichera les
    # SMS simules. Elle n'est donc joignable QUE depuis la VM elle-meme (boucle locale) : depuis
    # le poste, par tunnel SSH (docs/03-revues/2026-10-24-console-boucle-locale.md). Les portes
    # verify_* l'appellent en localhost depuis la VM : inchangees. La regle d'acces Tailscale
    # (acte de la proprietaire) reste le remede principal ; ceci est la seconde barriere.
    ports:
      - "127.0.0.1:3000:3000"

  # Reseau SMS simule (isc-sim) : recoit l'OTP livre par le coeur (POST /deliver, appel
  # coeur->reseau, comme vers une passerelle SMS) et laisse lire la boite d'un IMSI (GET
  # /inbox). Le canal d'INTERCEPTION d'AC-02 vit ICI, jamais dans le coeur (ADR-034, conforme
  # a ISC-SAD §5 qui nomme isc-sim). Stdlib Python, sur isc-net interne, aucune base.
  sim:
    image: python:3.12-alpine
    container_name: isc-sim
    command: ["python", "-m", "isc_simulator"]
    environment:
      PYTHONPATH: /src
    volumes:
      - ../simulator/src:/src:ro
    networks:
      - isc-net
    healthcheck:
      # 127.0.0.1 (IPv4) explicite : le serveur n'ecoute qu'en IPv4 ; localhost resout ::1 en premier.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  isc-net:
    name: isc-net
    internal: true
  # Reseau externe (bridge) reserve a l'acces navigateur de la console. Le coeur,
  # le PDP et postgres restent sur isc-net interne, jamais exposes a l'hote.
  isc-web:
    name: isc-web
    driver: bridge
  # L7-b (carte #67) : reseau DEDIE a la surface mobile du coeur, bridge non interne. Seul le
  # coeur y est attache, et seul le 8443 y est publie (sur ISC_MOBILE_BIND). Separe d'isc-web
  # pour que la console ne gagne pas une seconde attache non interne, et que le coeur n'ait
  # jamais la console dans son chemin reseau. Sortie Internet coupee par la regle DOCKER-USER :
  # L7-3, prerequis de la proprietaire, sans quoi l'isolement du coeur n'est pas acquis.
  isc-mobile:
    name: isc-mobile
    driver: bridge
    # Nom FIXE du pont Linux : la regle DOCKER-USER de la proprietaire (L7-3, aucune sortie du
    # sous-reseau isc-mobile) s'ecrit une fois sur ce nom, au lieu d'un br-<id> aleatoire.
    driver_opts:
      com.docker.network.bridge.name: br-isc-mobile

volumes:
  pgdata:
    name: isc-pgdata
  certs:
    name: isc-certs
