# TACHE-00 tache 3 - postgres seul ; ISC-DEPLOY §3.2 : isc-net interne, sans acces sortant
services:
  postgres:
    image: postgres:16
    container_name: isc-postgres
    env_file: .env
    networks:
      - isc-net
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/init.sql:/opt/isc/init.sql:ro
      - ./init/01-apply.sh:/docker-entrypoint-initdb.d/01-apply.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  isc-net:
    name: isc-net
    internal: true

volumes:
  pgdata:
    name: isc-pgdata
