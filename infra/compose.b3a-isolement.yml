# ISOLEMENT D'ESSAI — CE FICHIER N'EST JAMAIS LA VOIE NORMALE.
#
# Il n'existe QUE pour déployer la branche du couloir B à côté de la pile d'un autre couloir, le
# temps d'un essai, sans rien toucher à cette autre pile (décision de la propriétaire du
# 2026-10-23, carte B3a). La voie normale est docker-compose.yml seul (make up), ou avec la
# surcouche compose.b3a.yml.
#
# Il renomme TOUT ce que le fichier partagé fixe par nom, pour que l'essai ait les siens et puisse
# tourner PENDANT que la pile en service tourne (complété le 2026-10-24, carte #76 : la version
# précédente gardait les container_name, les réseaux et les ports du fichier partagé, donc entrait
# en collision avec la pile en service) :
#   - conteneurs : isc-b3a-* (le fichier partagé fixe isc-postgres, isc-core, … par nom) ;
#   - réseaux    : isc-b3a-net, isc-b3a-web, isc-b3a-mobile, TOUS internes (l'essai ne publie rien
#                  et ne doit avoir aucune sortie) — le DNS de service (postgres, pdp, core, sim)
#                  reste valable à l'intérieur du projet ; le PONT Linux du réseau mobile a aussi
#                  son propre nom (voir networks) ;
#   - ports      : aucun port publié (console 3000, cœur 8443) : l'essai n'est joignable que de
#                  l'intérieur de ses réseaux (docker compose -p isc-b3a exec …) ;
#   - volumes    : base neuve (init.sql + migrations s'exécutent) et autorité TLS neuve ;
#   - images     : les images construites ne remplacent pas celles de l'autre pile, SAUF le PDP,
#                  qui est l'image de la pile servie, jamais reconstruite ici (voir pdp).
# Usage (depuis infra/, avec un projet distinct) :
#   docker compose -p isc-b3a -f docker-compose.yml -f compose.b3a.yml -f compose.b3a-isolement.yml up -d --build
# Retrait : la même commande avec « down -v » ne supprime que les volumes isc-b3a-* ; les images
# isc-*-b3a se retirent à part.
services:
  postgres:
    container_name: isc-b3a-postgres
  ca-init:
    image: isc-tools-b3a
    container_name: isc-b3a-ca-init
  migrate:
    container_name: isc-b3a-migrate
    # Même image que postgres (déjà présente dans la VM, qui ne joint pas le registre) : seul psql
    # est utilisé par apply-migrations.sh ; le fichier partagé prend postgres:16-alpine.
    image: postgres:16
  pdp:
    # D-B7-1 (décision du superviseur technique du 2026-10-25) : le PDP isolé est l'IMAGE DE LA PILE
    # SERVIE, construite à la fenêtre de déploiement (routes /device/*, préchauffage #123), pour
    # que la mesure à froid de tools/device_register_cold/ se refasse depuis le dépôt. L'ancienne
    # image isc-pdp-b3a (22/10) n'avait pas ces routes (404 constaté le 25/10). « build » est retiré
    # et l'image n'est jamais tirée : un « up --build » ne réétiquette pas isc-pdp.
    image: isc-pdp
    build: !reset null
    pull_policy: never
    container_name: isc-b3a-pdp
  core:
    image: isc-core-b3a
    container_name: isc-b3a-core
    ports: !reset []
  console:
    image: isc-console-b3a
    container_name: isc-b3a-console
    ports: !reset []
  sim:
    container_name: isc-b3a-sim

networks:
  isc-net:
    name: isc-b3a-net
  isc-web:
    name: isc-b3a-web
    # Même raison que pour le réseau mobile : la console de l'essai ne publie rien (ports !reset [])
    # et n'a besoin que du DNS de service vers le cœur ; un bridge non interne lui donnerait une
    # sortie Internet (constatée le 2026-10-25 : http=301 depuis isc-b3a-web). Interne.
    internal: true
  isc-mobile:
    name: isc-b3a-mobile
    # Le fichier partagé fixe le NOM DU PONT Linux (br-isc-mobile, L7-b, règle DOCKER-USER de la
    # propriétaire). Deux réseaux ne peuvent pas porter le même pont : sans ce renommage, l'essai
    # ne démarre pas (constaté le 2026-10-25).
    driver_opts:
      com.docker.network.bridge.name: br-isc-b3a-mob
    # Ce pont-ci n'est couvert par AUCUNE règle DOCKER-USER (L7-3 ne vise que br-isc-mobile) : sans
    # « internal », le cœur de l'essai aurait une sortie Internet (relecture du couloir A,
    # 2026-10-25). L'essai ne publie aucun port sur ce réseau : il est donc interne, comme isc-net.
    internal: true

volumes:
  pgdata:
    name: isc-b3a-pgdata
  certs:
    name: isc-b3a-certs
