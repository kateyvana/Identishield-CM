[project]
name = "isc-hlr-agent"
version = "0.1.0"
description = "IdentiShield-CM hlr-agent : outil agent operateur, remplacement de SIM (EF-42)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
isc-hlr-agent = "isc_hlr_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isc_hlr_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
