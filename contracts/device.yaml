openapi: 3.1.0
info:
  title: IdentiShield-CM — PDP Device API
  version: 0.1.0
  summary: Cycle de vie de la clé d'appareil dans le PDP (isc-pdp)
  description: |
    Routes internes du PDP pour l'enrôlement d'un appareil (ADR-041 et son amendement du
    2026-10-17). Le cœur opérateur simulé (isc-core) est l'unique client : le PDP n'est jamais
    joignable depuis l'extérieur du réseau isc-net.

    Cycle de vie de la clé : EN ATTENTE (PENDING) → ACTIVE → RÉVOQUÉE (REVOKED). La clé est
    enregistrée EN ATTENTE par `POST /device/register` et ne devient ACTIVE qu'à
    `POST /device/activate`, après que l'usager a retapé en entier le code de récupération
    (invariant D4). Le code de récupération est produit par le PDP ; seul un haché salé est
    conservé (`pdp.recovery_code`) ; le code en clair n'est renvoyé qu'une fois.

    Contrat séparé d'`evaluate.yaml` pour qu'aucun couloir ne modifie le contrat de l'autre.

    Transport : mTLS obligatoire entre isc-core et isc-pdp (SPIKE-4, ADR-021).
servers:
  - url: https://isc-pdp:8081
    description: Réseau interne isc-net uniquement (jamais exposé à l'hôte)

security:
  - mtls: []

paths:
  /device/register:
    post:
      operationId: registerDevice
      summary: Enregistre la clé d'un appareil EN ATTENTE et émet le code de récupération
      description: |
        Vérifie la chaîne d'attestation (clé matérielle, défi attendu) et la signature du défi par
        la clé présentée, puis enregistre la clé EN ATTENTE : le compte n'est pas utilisable tant
        que `/device/activate` n'a pas réussi. Renvoie le code de récupération en clair, une seule
        fois.

        Au plus UNE clé EN ATTENTE par compte, garantie par la base : un nouvel enregistrement
        RÉVOQUE la clé EN ATTENTE précédente du compte (réponse perdue, nouvel essai), dont le code
        de récupération ne peut plus rien activer.

        **Réenrôlement (carte B3b ; ADR-041 amendement du 2026-10-17 ; décisions de la propriétaire
        du 2026-10-24).** Invariant R1 : si le compte possède déjà une clé ACTIVE, la route EXIGE
        `recoveryCode`, l'ancien code, vérifié ICI avec l'attestation, en une seule fois — jamais par
        une route à part (oracle). Réponse UNIFORME : code faux ou absent, attestation ou signature
        refusée → 401 RECOVERY_INVALID, mêmes corps et durée (toutes les vérifications sont faites,
        quoi qu'il arrive). Chaque échec compte pour `origin`, `installationId` (si connu) et le
        compte (ADR-030, ES-24) ; après REENROL_ATTEMPTS, l'origine et l'installation attendent
        LOCK_BASE doublé, plafonné LOCK_MAX → 429 THROTTLED + Retry-After (ES-21) ; le compte n'est
        JAMAIS bloqué. La clé ACTIVE RESTE ACTIVE : elle n'est révoquée qu'à `/device/activate`,
        dans la même transaction que l'activation de la nouvelle (ES-14b, ES-20).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Clé enregistrée EN ATTENTE ; code de récupération émis une fois.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            RECOVERY_INVALID (compte déjà lié : code faux ou absent, attestation ou signature
            refusée, sans dire lequel), ou MTLS_REQUIRED si le certificat client manque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RECOVERY_INVALID
                message: recovery code or attestation rejected
        '429':
          description: >-
            THROTTLED (ES-21) : l'appelant (origine ou installation) est bloqué après
            REENROL_ATTEMPTS échecs, durée LOCK_BASE doublée à chaque palier, plafonnée LOCK_MAX ;
            le compte est compté mais jamais bloqué. Rendu AVANT tout calcul. Même valeur dans
            l'en-tête Retry-After et dans retryAfterSeconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Secondes à attendre avant un nouvel essai.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledError'
              example:
                code: THROTTLED
                message: too many failed attempts
                retryAfterSeconds: 60
        '422':
          description: >-
            ATTESTATION_REJECTED (premier enrôlement : chaîne, défi ou signature refusés) ou
            DEVICE_UNSUPPORTED (clé logicielle, émulateur ; nommée même au réenrôlement : elle parle
            de l'appareil, pas du code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DEVICE_UNSUPPORTED
                message: hardware-backed key required
  /device/state:
    get:
      operationId: getDeviceState
      summary: Énonce le FAIT de liaison d'un compte (NONE, PENDING ou ACTIVE)
      description: |
        ES-26 : c'est le PDP qui détient la clé et dit si elle existe. La route énonce un FAIT et ne
        décide rien : le PDP énonce, le cœur arbitre. Correspondance faite par le cœur : ACTIVE →
        RECOVERY ; NONE et PENDING → OTP (une clé EN ATTENTE jamais activée n'a lié personne).

        Le cœur ne l'appelle qu'APRÈS avoir vérifié le PIN : un appelant non authentifié n'apprend
        rien (la réponse uniforme d'ES-22 tombe avant). Route interne, jamais atteignable depuis
        l'application. PDP injoignable : le cœur refuse l'enrôlement (503), il ne retombe JAMAIS
        sur l'OTP.
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fait de liaison du compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /device/activate:
    post:
      operationId: activateDevice
      summary: Active la clé EN ATTENTE après la confirmation du code de récupération
      description: |
        Vérifie le code de récupération retapé en entier contre le haché salé et fait passer la clé
        EN ATTENTE à ACTIVE. Tout échec (code erroné, appareil inconnu, clé qui n'est pas EN
        ATTENTE) reçoit la MÊME réponse : l'appelant n'apprend jamais lequel a échoué. Un échec
        laisse la clé EN ATTENTE : l'état ne progresse jamais sur une erreur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: Clé ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            RECOVERY_INVALID (réponse unique pour tout échec d'activation), ou MTLS_REQUIRED si le
            certificat client manque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RECOVERY_INVALID
                message: recovery code rejected
  /device/{deviceId}/nonce:
    get:
      operationId: issueDeviceNonce
      summary: Défi de session — un nonce du PDP émis pour le compte de la clé ACTIVE
      description: |
        Carte B4 (décision de la propriétaire du 2026-10-24, point 4) : le défi de session EST un
        nonce du PDP (ES-10 : 128 bits, usage unique, NONCE_TTL), lié au compte que porte la clé
        ACTIVE de cet identifiant. L'application ne connaît que son deviceId au moment du défi ;
        c'est le PDP qui retrouve le compte. Une clé EN ATTENTE ou RÉVOQUÉE n'a pas de défi.

        Aucune clé ACTIVE de cet identifiant : 404. Le cœur rend alors à l'application un défi de
        même forme, qui ne vaudra rien (réponse uniforme, ES-22). Route interne.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nonce émis pour le compte de la clé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceNonceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Aucune clé ACTIVE ne porte cet identifiant (DEVICE_UNKNOWN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DEVICE_UNKNOWN
                message: no active device key with this id
  /device/verify:
    post:
      operationId: verifyDeviceChallenge
      summary: Vérifie la signature du défi de session par la clé ACTIVE du compte
      description: |
        ISC-MOB-SPEC §6, flux B : « le PDP reconnaît la clé ». Le PDP vérifie que la clé ACTIVE
        `deviceId` du compte a signé les octets UTF-8 du défi tels que remis (SHA256withECDSA,
        ADR-018), puis consomme le nonce : la signature d'abord, le nonce ensuite. Verdict :
        VALID (défi consommé, le cœur ouvre la session), REVOKED (une clé RÉVOQUÉE porte cet
        identifiant : le contrat mobile répond KEY_REVOKED), INVALID pour toute autre faute, sans
        dire laquelle. Le PDP énonce, le cœur arbitre. Le cœur ne l'appelle qu'APRÈS le PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verdict rendu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trust/{accountId}:
    get:
      operationId: readTrustState
      summary: Lit l'état de confiance d'un compte (TRUSTED, PROBATION, FROZEN) — lecture seule
      description: |
        ADR-041, amendement du 2026-10-24 (décision du superviseur technique). Route INTERNE du PDP
        (mTLS cœur↔PDP, jamais servie sur le 8443), LECTURE SEULE : aucune écriture en base, aucune
        entrée d'audit. Le cœur la consomme pour GET /mobile/v1/account (champ `state`), jamais pour
        décider : le refus d'une sortie d'un compte gelé reste la décision de POST /evaluate (REJECTED,
        vetoApplied ACCOUNT_FROZEN).

        Les échéances passées (fin de probation CAR_IMSI, TTL de gel) sont appliquées en mémoire par
        les mêmes règles que /evaluate : l'état renvoyé est celui que la prochaine décision
        constaterait. Compte que le PDP n'a jamais vu (aucune ligne pdp.trust_state) : 404.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: État de confiance du compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustResponse'
              example:
                state: FROZEN
                since: '2026-10-24T15:48:31.529168Z'
                probationUntil: null
                freezeUntil: '2026-10-25T15:48:31.529168Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Aucun état de confiance pour ce compte (ACCOUNT_UNKNOWN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ACCOUNT_UNKNOWN
                message: no trust state for this account

components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Certificats de service émis par l'autorité locale (SPIKE-4).

  responses:
    BadRequest:
      description: Requête hors contrat (champ manquant, type ou domaine invalide).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONTRACT_VIOLATION
            message: attestationChain must not be empty
    Unauthorized:
      description: mTLS absent ou certificat client invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: MTLS_REQUIRED
            message: client certificate required

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [accountId, publicKey, attestationChain, attestationChallenge, challengeSignature, origin]
      properties:
        accountId:
          type: string
        publicKey:
          type: string
          description: SubjectPublicKeyInfo DER en base64 (EC P-256, ADR-018).
        attestationChain:
          type: array
          minItems: 1
          items:
            type: string
            description: Certificat X.509 DER en base64, feuille en premier.
        attestationChallenge:
          type: string
          description: Défi d'attestation émis par le cœur pour cet enrôlement (base64, au moins 16 octets).
        challengeSignature:
          type: string
          description: Signature du défi d'attestation par la clé présentée (base64).
        recoveryCode:
          type: string
          description: >-
            Réenrôlement seulement : l'ancien code de récupération, retapé par l'usager, vérifié
            ici avec l'attestation (ADR-041). Jamais conservé en clair par le cœur.
        origin:
          type: string
          description: Origine réseau de l'appelant (adresse vue par le cœur) ; clé de comptage ADR-030.
        installationId:
          type: string
          description: >-
            Identifiant d'installation de l'application (étiquette aléatoire, ni secret ni
            facteur) ; clé de comptage ADR-030, absent si l'application ne l'a pas envoyé.
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [deviceId, recoveryCode]
      properties:
        deviceId:
          type: string
        recoveryCode:
          type: string
          description: >-
            Code de récupération en clair, renvoyé UNE seule fois (CODE_LENGTH caractères, alphabet
            sans 0/O/1/I/L) ; seul un haché salé est conservé.
    DeviceStateResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [NONE, PENDING, ACTIVE]
    ActivateRequest:
      type: object
      additionalProperties: false
      required: [accountId, deviceId, recoveryCode]
      properties:
        accountId:
          type: string
        deviceId:
          type: string
        recoveryCode:
          type: string
          description: Le code complet, retapé une fois sur E-09.
    ActivateResponse:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId:
          type: string
    DeviceNonceResponse:
      type: object
      additionalProperties: false
      required: [nonce]
      properties:
        nonce:
          type: string
          pattern: '^[0-9a-f]{32}$'
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [accountId, deviceId, challenge, signature]
      properties:
        accountId:
          type: string
        deviceId:
          type: string
        challenge:
          type: string
          description: Le défi tel que remis à l'application (le nonce), signé octet pour octet.
        signature:
          type: string
          description: SHA256withECDSA, DER en base64 (ADR-018).
        nonce:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: >-
            Carte B6 : présent, la signature porte sur `challenge` pris comme chaîne canonique
            ADR-018 qui CONTIENT ce nonce en dernier champ (ex. accountId|CANCEL|transferId|nonce),
            et c'est ce nonce qui est consommé. Absent : le défi est lui-même le nonce (B4).
    VerifyResponse:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [VALID, INVALID, REVOKED]
    TrustResponse:
      type: object
      additionalProperties: false
      required: [state, since, probationUntil, freezeUntil]
      properties:
        state:
          type: string
          enum: [TRUSTED, PROBATION, FROZEN]
        since:
          type: string
          format: date-time
          description: Entrée dans l'état courant (UTC).
        probationUntil:
          type: [string, 'null']
          format: date-time
          description: Fin de la période CAR_IMSI en cours ; null hors probation.
        freezeUntil:
          type: [string, 'null']
          format: date-time
          description: Fin du gel issu d'une décision FREEZE (TTL_FREEZE) ; null hors gel, ou gel « ce n'est pas moi » (sans échéance).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ThrottledError:
      type: object
      additionalProperties: false
      required: [code, message, retryAfterSeconds]
      properties:
        code:
          type: string
          enum: [THROTTLED]
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Reprise de l'en-tête Retry-After, lue par le cœur pour la réponse mobile 429.
