# Portes lourdes (ISC-DEPLOY §5.2, §5.3) : executeur auto-heberge `isc-vm`
# dans la machine virtuelle.
#
# CI-01 (2026-10-22) : AUCUN executeur n'est inscrit, et ce flux n'a jamais
# tourne. Il ne se declenche donc plus ni sur pull request ni chaque nuit :
# des travaux qui restent indefiniment en attente laissaient croire a une
# verification qui n'avait pas lieu. Sur un depot PUBLIC, un executeur
# auto-heberge executerait en outre dans la VM le code de toute pull request,
# forks compris. Les portes lourdes sont verifiees A LA MAIN dans la VM
# (make up, make check-stack, make abuse) ; procedure et resultats :
# docs/03-revues/2026-10-22-ci-01-verification-manuelle.md.
# Lancement manuel possible le jour ou un executeur est inscrit.
name: heavy

on:
  workflow_dispatch:

jobs:
  portes-lourdes:
    runs-on: [self-hosted, isc-vm]
    steps:
      - uses: actions/checkout@v5

      - name: Demarrage de la pile
        run: make up

      - name: Sante, isolation reseau, role d'audit (ED-06)
        run: make check-stack

      - name: Cas d'abus T-AC-01..13
        run: make abuse

      - name: Arret de la pile
        if: always()
        run: make down
