# Jeu de règles versionné du PDP (EF-17, ES-15). SOURCE UNIQUE des paramètres
# nommés : ils vivent ici, jamais en littéral dans le code (porte
# tools/check_named_params.py). Le cœur ET le PDP lisent ce même fichier (monté
# en lecture seule dans les deux conteneurs) — « les paramètres à un seul endroit ».
#
# Valeurs = ISC-TM v1.1 §7 « Valeur v1 » (initiales ; le protocole d'évaluation
# du mois 4 mesurera leur sensibilité). Durées en ISO-8601 ; montants en FCFA
# entiers (ED-05) ; NIGHT = fenêtre horloge murale UTC serveur (ED-04).
#
# La version DOIT figurer dans chaque décision /evaluate (EF-11 ruleSetVersion,
# EF-17). Toute modification d'un paramètre s'accompagne d'un incrément de version.
ruleset:
  version: rs-0.3.0 # bump : paramètres de ré-enrôlement et de l'application mobile, retrait de CAR_ENROL (ISC-AMD-02 v1.1)
  parameters:
    CAR_IMSI: PT72H # carence post-changement d'IMSI (72 h, état PROBATION)
    # CAR_ENROL (PT48H, carence post-ré-enrôlement) : RETIRÉ — SRS v1.3, ISC-TM v1.2 §7, ES-03c ; retiré ici par ISC-AMD-02 v1.1
    CAP_PROB: # plafond de sortie en PROBATION : min(dailyXaf ; balancePct % du solde)
      dailyXaf: 25000
      balancePct: 10
    THR_HIGH: # seuil « montant élevé » : min(absoluteXaf ; medianFactor × médiane 30 j)
      absoluteXaf: 50000
      medianFactor: 3
    THR_4EYES: # seuil quatre-yeux SOC
      xaf: 100000
    TTL_FREEZE: PT24H # TTL de gel, puis annulation
    NIGHT: "23:00-05:00" # fenêtre nuit, heure serveur UTC (signal secondaire, jamais veto)
    VEL: # fenêtre de vélocité : > count sorties / window OU > newBeneficiaries nouveaux / beneficiaryWindow
      count: 3
      window: PT10M
      newBeneficiaries: 3
      beneficiaryWindow: PT24H
    DEFER: PT4H # temporisation STEP_UP sur USSD
    OTP: # OTP à usage unique (EF-03) : forme et durée sont des PARAMÈTRES, pas des constantes
      length: 6 # chiffres décimaux
      ttl: PT5M # durée de validité
    # Ré-enrôlement (ADR-029, ADR-030 ; ES-21, ES-24 ; déclarés par SRS v1.4 §0) — valeurs d'ISC-AMD-01 §5
    REENROL_ATTEMPTS: 2 # tentatives libres avant le délai croissant
    LOCK_BASE: PT30S # délai initial, doublé à chaque échec (appareil demandeur + origine réseau)
    LOCK_MAX: PT24H # plafond du délai croissant ; réglable par le propriétaire
    ALERT_REENROL: # seuil d'alerte console par compte (ES-24), sans aucune restriction du compte
      count: 5
      window: PT1H
    # CODE_LENGTH (longueur du code de récupération) : NON FIXÉ — ISC-AMD-01 §5 « à fixer par l'opérateur » ; décision du propriétaire attendue
    # Application mobile (SRS v1.4 §0, ISC-MOB-SPEC v1.1 §14) — valeurs PROPOSÉES, à calibrer, à valider par le propriétaire
    REENROL_FREEZE: PT24H # gel des ré-enrôlements après « ce n'est pas moi » (proposé : aligné sur TTL_FREEZE)
    ENROL_TTL: PT10M # expiration d'un enrôlement entamé (proposé : 2 × OTP.ttl)
    APP_SESSION_TTL: PT5M # jeton de session de l'application, lectures seulement (proposé)
    POLL_FOREGROUND: PT30S # interrogation des alertes, application au premier plan (proposé)
    POLL_BACKGROUND: PT15M # arrière-plan : minimum des tâches périodiques Android (ISC-MOB-SPEC §9.4)
