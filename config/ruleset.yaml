# Jeu de règles versionné du PDP (EF-17, ES-15). SOURCE UNIQUE des paramètres
# nommés : ils vivent ici, jamais en littéral dans le code (porte
# tools/check_named_params.py). Le cœur ET le PDP lisent ce même fichier (monté
# en lecture seule dans les deux conteneurs) — « les paramètres à un seul endroit ».
#
# Valeurs = ISC-TM v1.1 §7 « Valeur v1 » (initiales ; le protocole d'évaluation
# du mois 4 mesurera leur sensibilité). Durées en ISO-8601 ; montants en FCFA
# entiers (ED-05) ; ~~NIGHT = fenêtre horloge murale UTC serveur (ED-04)~~ NIGHT = fenêtre en
# heure LOCALE du fuseau NIGHT_ZONE (rs-0.8.0, amendement ED-04 PROPOSÉ) ; les horodatages restent UTC serveur.
#
# Calibration T3-07 (rs-0.8.0) : valeurs PROVISOIRES issues de l'étude hors ligne sur le jeu
# légitime gelé (dev horizon v1) et le plan AC-02 gelé ; ADR-016 PROVISOIRE ; amendements
# ISC-TM §7, ES-06, ES-11, ED-04 au statut PROPOSÉ (note de revue T3-07, citée par ADR-016). Le moteur de
# règles n'existe pas encore (mois 4) : SCORE, W, STEP_UP_POLICY, NIGHT_ZONE et CAP_FAILCLOSED
# ne sont lus par aucun code à ce jour.
#
# La version DOIT figurer dans chaque décision /evaluate (EF-11 ruleSetVersion,
# EF-17). Toute modification d'un paramètre s'accompagne d'un incrément de version.
ruleset:
  version: rs-0.9.0 # bump : CODE_LENGTH 20 → 6 (décision du propriétaire du 10/10, carte B1a ; numéro à renuméroter à la fusion) ; rs-0.8.0 = calibration T3-07 PROVISOIRE (SCORE, W, STEP_UP_POLICY, NIGHT_ZONE, CAP_FAILCLOSED ; sémantique CAP_PROB précisée ; numérotée rs-0.6.0 sur la branche t3-07, renumérotée à l'intégration) ; rs-0.7.0 = NONCE_TTL (M-09) ; rs-0.6.0 = QUICK_AMOUNTS (M-07) ; rs-0.5.0 = APP_NETWORK_TIMEOUT (correctif M-06) ; rs-0.4.0 = OTP_RESEND_DELAY (M-06) ; rs-0.3.0 = ré-enrôlement et application mobile (ISC-AMD-02 v1.1)
  parameters:
    CAR_IMSI: PT72H # carence post-changement d'IMSI (72 h, état PROBATION)
    # CAR_ENROL (PT48H, carence post-ré-enrôlement) : RETIRÉ — SRS v1.3, ISC-TM v1.2 §7, ES-03c ; retiré ici par ISC-AMD-02 v1.1
    CAP_PROB: # ES-04, veto en PROBATION : cumul des sorties sur `window` glissante + montant > min(dailyXaf ; balancePct % du solde à l'entrée en PROBATION) -> FREEZE
      dailyXaf: 25000 # inchangé (T3-07 : au-delà, la friction cas b ne baisse plus)
      balancePct: 10 # inchangé (T3-07 : levier de perte AC-07 ; 25 % triplerait la perte médiane)
      balanceBase: PROBATION_ENTRY # solde de référence figé à l'entrée en PROBATION (T3-07)
      window: PT24H # cumul glissant (T3-07)
    # ~~ES-11 fail-closed = CAP_PROB~~ : séparé (T3-07). ATTENTION : le cœur lit encore CAP_PROB.dailyXaf
    # pour le fail-closed (FailClosedPolicy) ; le recâblage attend la ratification de l'amendement ES-11.
    CAP_FAILCLOSED: # ES-11 (amendement PROPOSÉ) : PDP indisponible -> refus de toute sortie > xaf, par transaction
      xaf: 50000 # H5 < 2 % par persona public (salarié 1,91 % ; 2,67 % à 25 000) ; agents 2,49 % déclarés
    THR_HIGH: # seuil « montant élevé » : min(absoluteXaf ; medianFactor × médiane 30 j)
      absoluteXaf: 50000
      medianFactor: 3
    THR_4EYES: # seuil quatre-yeux SOC
      xaf: 100000
    TTL_FREEZE: PT24H # TTL de gel, puis annulation
    NIGHT: "23:00-05:00" # fenêtre nuit en heure LOCALE de NIGHT_ZONE (signal secondaire, jamais veto) ; ~~heure serveur UTC~~ (rs-0.8.0)
    NIGHT_ZONE: Africa/Douala # WAT = UTC+1, SUPPOSÉ et déclaré (heure du CSV réel naïve) ; amendement ED-04 PROPOSÉ
    VEL: # fenêtre de vélocité : > count sorties / window OU > newBeneficiaries nouveaux / beneficiaryWindow
      count: 3
      window: PT10M
      newBeneficiaries: 3
      beneficiaryWindow: PT24H
    DEFER: PT4H # temporisation STEP_UP ; ~~sur USSD~~ : USSD = BLOQUER (STEP_UP_POLICY.ussd), DEFER écarté pour l'USSD (décision du propriétaire du 06/10, ADR-016)
    NONCE_TTL: PT120S # validité d'un nonce de signature (ES-10 : 120 s) ; nommé par M-09 (ISC-MOB-SPEC §14 « à nommer »)
    # --- Score comportemental (ES-05a..f) et agrégation — ADR-016 PROVISOIRE, calibration T3-07 ---
    SCORE: # décision = bandes sur l'agrégat des contributions W
      aggregation: bounded_sum # somme bornée à max ; « max » écarté par les données (NIGHT inerte, aucun FREEZE sans IMSI)
      max: 100
      stepUp: 40 # ES-05f : score >= stepUp -> STEP_UP
      freeze: 70 # ES-05f : score >= freeze -> FREEZE
    W: # contributions au score (points)
      newBeneficiary: 15 # ES-05b : bénéficiaire jamais vu ; plus petit poids tel que NIGHT + nouveau >= stepUp
      newBeneficiaryHigh: 45 # ES-05b : nouveau ET montant >= THR_HIGH (remplace newBeneficiary) ; plus petit poids tel que + NIGHT >= freeze
      vel: 70 # ES-05c : dépassement de VEL (l'une des deux clauses) ; seul = FREEZE
      night: 25 # ES-05d, ISC-TM AC-06 : sortie dans NIGHT ; 15 serait inerte (T3-07)
    STEP_UP_POLICY: # ES-06 résolu — décision du propriétaire du 06/10 (ADR-016) : USSD = BLOQUER
      app: SIGNATURE # STEP_UP résolu par signature du dispositif lié (preuve), puis réévaluation
      ussd: CANCEL # aucun renforcement possible sur USSD -> CANCELLED (scénario « plafond » de T3-07)
    OTP: # OTP à usage unique (EF-03) : forme et durée sont des PARAMÈTRES, pas des constantes
      length: 6 # chiffres décimaux
      ttl: PT5M # durée de validité ; OTP_TTL (SRS v1.4 §0) est un alias de OTP.ttl
    OTP_ATTEMPTS: 3 # essais d'OTP avant nouvel OTP obligatoire (SRS v1.4 §0) ; à calibrer
    OTP_RESENDS: 2 # renvois d'OTP autorisés (SRS v1.4 §0) ; à calibrer
    OTP_RESEND_DELAY: PT60S # attente avant « Renvoyer le code » (E-05) ; décidé par le propriétaire (M-06) ; lu par l'application à la construction
    # Ré-enrôlement (ADR-029, ADR-030 ; ES-21, ES-24 ; déclarés par SRS v1.4 §0) — valeurs d'ISC-AMD-01 §5
    REENROL_ATTEMPTS: 2 # tentatives libres avant le délai croissant
    LOCK_BASE: PT30S # délai initial, doublé à chaque échec (appareil demandeur + origine réseau)
    LOCK_MAX: PT24H # plafond du délai croissant ; réglable par le propriétaire
    ALERT_REENROL: # seuil d'alerte console par compte (ES-24), sans aucune restriction du compte
      count: 5
      window: PT1H
    CODE_LENGTH: 6 # longueur du code de récupération (ADR-029) ; 20 → 6 : décision du propriétaire du 10/10 (carte B1a), code retapé en entier sur E-09
    # Application mobile (SRS v1.4 §0, ISC-MOB-SPEC v1.1 §14) — valeurs PROPOSÉES, à calibrer, à valider par le propriétaire
    REENROL_FREEZE: PT24H # gel des ré-enrôlements après « ce n'est pas moi » (proposé : aligné sur TTL_FREEZE)
    ENROL_TTL: PT10M # expiration d'un enrôlement entamé (proposé : 2 × OTP.ttl)
    APP_SESSION_TTL: PT5M # jeton de session de l'application, lectures seulement (proposé)
    POLL_FOREGROUND: PT30S # interrogation des alertes, application au premier plan (proposé)
    POLL_BACKGROUND: PT15M # arrière-plan : minimum des tâches périodiques Android (ISC-MOB-SPEC §9.4)
    APP_NETWORK_TIMEOUT: PT10S # délai d'expiration réseau de l'application (MOB-NF-03) ; lu à la construction
    # Connexions persistantes (ADR-039, D9) : l'application rend une connexion inactive AVANT que le serveur ne la ferme.
    APP_CONN_KEEPALIVE: PT20S # réserve de connexion de l'application ; DOIT être < SERVER_CONN_KEEPALIVE (vérifié à la construction) ; proposé, à valider par le propriétaire
    SERVER_CONN_KEEPALIVE: PT30S # fermeture d'une connexion inactive par le serveur (faux serveur ; cœur : carte B3) ; proposé, à valider par le propriétaire
    QUICK_AMOUNTS: # montants rapides de l'écran Montant (E-13), en FCFA ; décidé par le propriétaire (M-07) ; lu à la construction
      - 5000
      - 10000
      - 25000
      - 50000
