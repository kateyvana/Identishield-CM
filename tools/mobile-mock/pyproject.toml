[project]
name = "isc-mobile-mock"
version = "0.1.0"
description = "IdentiShield-CM mobile-mock : faux serveur de l'API mobile pour développer l'application (M-03)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
isc-mobile-mock = "isc_mobile_mock.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isc_mobile_mock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
