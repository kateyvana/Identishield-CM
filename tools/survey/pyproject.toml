[project]
name = "isc-survey"
version = "0.1.0"
description = "IdentiShield-CM : analyse du sondage utilisateurs (FR + EN), bibliothèque standard seule (ADR-033)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isc_survey"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
