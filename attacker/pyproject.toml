[project]
name = "isc-attacker"
version = "0.1.0"
description = "IdentiShield-CM attacker : outil d'orchestration des cas d'abus (EF-40 ; AC-02)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
isc-attacker = "isc_attacker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isc_attacker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
