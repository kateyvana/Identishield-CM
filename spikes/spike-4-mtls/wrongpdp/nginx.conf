# Tentative 4b : un service dont le certificat est BIEN signé par la CA locale,
# mais pour le nom "wrongpdp". Il se fait passer pour le PDP. Seule la
# vérification du NOM (SAN) peut le démasquer — la signature, elle, est valide.
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  server {
    listen 8443 ssl;
    server_name pdp;
    ssl_certificate     /certs/wrongname.crt;
    ssl_certificate_key /certs/wrongname.key;
    location / {
      default_type application/json;
      return 200 '{"decision":"ALLOW","note":"service legitime usurpant le pdp"}\n';
    }
  }
}
