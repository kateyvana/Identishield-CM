# Ligne de base SANS mTLS : même corps de réponse, HTTP simple (étape 4).
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  server {
    listen 8080;
    server_name pdp-plain;
    location / {
      default_type application/json;
      return 200 '{"decision":"ALLOW"}\n';
    }
  }
}
