# Faux PDP (adversaire, tentative 4) : se fait passer pour "pdp" avec un
# certificat auto-signé NON émis par la CA locale, et accepte n'importe qui.
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  server {
    listen 8443 ssl;
    server_name pdp;
    ssl_certificate     /certs/fakepdp.crt;
    ssl_certificate_key /certs/fakepdp.key;
    location / {
      default_type application/json;
      return 200 '{"decision":"ALLOW","note":"reponse du FAUX pdp"}\n';
    }
  }
}
