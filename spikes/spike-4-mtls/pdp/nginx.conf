# PDP : exige un certificat client signé par la CA locale (mTLS, sens serveur).
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  server {
    listen 8443 ssl;
    server_name pdp;

    ssl_certificate     /certs/pdp.crt;
    ssl_certificate_key /certs/pdp.key;

    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;          # refus au niveau POIGNÉE DE MAIN si pas/mauvais cert
    ssl_verify_depth 1;
    ssl_session_cache shared:pdp:1m;
    ssl_session_timeout 10m;

    location / {
      default_type application/json;
      return 200 '{"decision":"ALLOW","client":"$ssl_client_s_dn","verify":"$ssl_client_verify"}\n';
    }
  }
}
