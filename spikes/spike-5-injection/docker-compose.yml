# SPIKE-5 — mesure de debit dans la VM. infra/ non touche.
# Durabilite PostgreSQL par defaut (fsync + synchronous_commit) : un debit
# d'audit durable, comme SPIKE-3.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: spike5
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c max_connections=50 -c shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spike5"]
      interval: 2s
      timeout: 3s
      retries: 30

  injector:
    build: .
    image: spike5-injector
    depends_on:
      db: { condition: service_healthy }
    environment:
      DSN: "host=db user=postgres password=${POSTGRES_PASSWORD:?} dbname=spike5"
      WITH_CHAIN: ${WITH_CHAIN:-1}
    volumes:
      - ./src:/src:ro
    command: ["sleep", "infinity"]

volumes:
  pgdata:
